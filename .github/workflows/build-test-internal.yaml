name: Build & test the SIL Kit FMU Importer (internal)

# Define the triggers for this workflow
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      fmu-architecture:
        description: 'Architectures of VTT groups 1-3 (TEG_ETH_Demo always runs in x86); FMU sets are generated in vtt-test-fmus-tmp/<run id> and deleted afterwards'
        type: choice
        default: 'x64,x86'
        options: ['x64,x86', x64, x86]

concurrency:
  group: build-fmu-importer
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: [Windows, ska, docker]
    environment: build-action
    container: ${{ vars.WIN_DOCKER_IMAGE_URI }}

    steps:
    # Check out this Git repo
    - uses: actions/checkout@v4

    - name: Build & Publish
      run: dotnet build ./FmuImporter/BuildAll/Build.csproj -v:m

    - name: Build Tests
      run: dotnet build ./FmuImporter/BuildAll/BuildTests.csproj -v:m
    - name: Run Tests
      run: dotnet test ./FmuImporter/_build/crossplatform-x64-Release/FmuImporter.Tests.dll --results-directory ./FmuImporter/_testResults --logger:"html;LogFilePrefix=testResults;verbosity=detailed"
    - name: Run vCDL Exporter Tests
      if: success() || failure()
      run: dotnet test ./VcdlExporter/_build/crossplatform-x64-Release/VcdlExporter.Tests.dll --results-directory ./VcdlExporter/_testResults --logger:"html;LogFilePrefix=testResults;verbosity=detailed"

    - name: Upload test results
      uses: actions/upload-artifact@v3
      env:
        http_proxy: ""  # Explicitly disable the proxy for Node.js
        https_proxy: ""  # Explicitly disable the proxy for Node.js
      with:
        name: fmu-importer-win-x64-test-result
        retention-days: 1
        path: ./FmuImporter/_testResults

    - name: Upload vCDL Exporter test results
      if: success() || failure()
      uses: actions/upload-artifact@v3
      env:
        http_proxy: ""  # Explicitly disable the proxy for Node.js
        https_proxy: ""  # Explicitly disable the proxy for Node.js
      with:
        name: vcdl-exporter-win-x64-test-result
        retention-days: 1
        path: ./VcdlExporter/_testResults

  # Build the project, then remove the built artifacts
  build-linux:
    runs-on: [Linux, self-hosted, ska]
    environment: build-action
    container:
      image: ${{ vars.LINUX_DOCKER_IMAGE_URI }}
      credentials:
        username: ${{ secrets.ARTIFACTORY_USR }}
        password: ${{ secrets.ARTIFACTORY_PSW }}
      options: --privileged

    steps:
    - name: cleanup
      run: |
        rm -rf ./*

    # Check out this Git repo
    - uses: actions/checkout@v4

    - name: Restore packages
      run: dotnet restore ./FmuImporter/BuildAll/Build.csproj -p:NuGetAudit=false

    - name: Build & Publish
      env:
        HTTP_PROXY: ${{ secrets.PROXY }}
        HTTPS_PROXY: ${{ secrets.PROXY }}
        NO_PROXY: ${{ secrets.NO_PROXY }}
      run: dotnet build ./FmuImporter/BuildAll/Build.csproj -v:m --no-restore -p:RestoreDuringBuild=false -p:Restore=false

    - name: Restore test packages
      run: dotnet restore ./FmuImporter/BuildAll/BuildTests.csproj -p:NuGetAudit=false

    - name: Build Tests
      run: dotnet build ./FmuImporter/BuildAll/BuildTests.csproj -v:m --no-restore -p:RestoreDuringBuild=false -p:Restore=false
    - name: Run Tests
      run: dotnet test ./FmuImporter/_build/crossplatform-x64-Release/FmuImporter.Tests.dll --results-directory ./FmuImporter/_testResults --logger:"html;LogFilePrefix=testResults;verbosity=detailed"
    - name: Run vCDL Exporter Tests
      if: success() || failure()
      run: dotnet test ./VcdlExporter/_build/crossplatform-x64-Release/VcdlExporter.Tests.dll --results-directory ./VcdlExporter/_testResults --logger:"html;LogFilePrefix=testResults;verbosity=detailed"

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      env:
        http_proxy: ""  # Explicitly disable the proxy for Node.js
        https_proxy: ""  # Explicitly disable the proxy for Node.js
      with:
        name: fmu-importer-build
        retention-days: 1
        path: ./FmuImporter/_publish/*.zip
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      env:
        http_proxy: ""  # Explicitly disable the proxy for Node.js 
        https_proxy: ""  # Explicitly disable the proxy for Node.js
      with:
        name: fmu-importer-linux-x64-test-result
        retention-days: 1
        path: ./FmuImporter/_testResults

    - name: Upload vCDL Exporter test results
      if: success() || failure()
      uses: actions/upload-artifact@v3
      env:
        http_proxy: ""  # Explicitly disable the proxy for Node.js
        https_proxy: ""  # Explicitly disable the proxy for Node.js
      with:
        name: vcdl-exporter-linux-x64-test-result
        retention-days: 1
        path: ./VcdlExporter/_testResults
    
    - if: always()
      run: rm -rfv * .??*

  run-windows-integration-tests:
    needs: [build-linux, build-windows]
    uses: ptv/sil-kit-fmu-importer-supplements/.github/workflows/testAutomationWindows.yaml@main
    with:
      fmu-importer-version: 1.8.1
      sil-kit-version: 5.0.7
      supplements-branch-name: ${{ github.head_ref || github.ref_name }}
      runner-labels: '["Windows", "ska", "docker"]'                 # build/support jobs → ska
      test-runner-labels: '["Windows", "medium", "docker-windows"]' # 3 group playlists → org
      run-vtt-tests: true
      fmu-architecture: ${{ inputs.fmu-architecture || 'x64' }}    # pull_request runs → x64
      vtt-fmu-tmp: ${{ github.event_name == 'workflow_dispatch' }}  # manual runs → per-run tmp FMU folder
    secrets: inherit

  run-linux-integration-tests:
    needs: [build-linux]
    uses: ptv/sil-kit-fmu-importer-supplements/.github/workflows/testAutomationLinux.yaml@main
    with:
      fmu-importer-version: 1.8.1
      sil-kit-version: 5.0.7
      branch-name: ${{ github.head_ref || github.ref_name }}
      vtt-fmu-tmp: ${{ github.event_name == 'workflow_dispatch' }}  # manual runs → per-run tmp FMU folder
    secrets: inherit
